name: Build SmartMorning Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build SmartMorning APK (ميقات الفجر)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies Cleanly (npm ci)
        run: npm ci

      - name: Verify Dependency Tree (No Peer Conflicts)
        run: npm ls esbuild vite @tailwindcss/vite @vitejs/plugin-react

      - name: Typecheck & Build Web Bundle
        run: |
          npm run lint
          npm run build

      - name: Generate SmartMorning Android Icons & Sync Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          node scripts/generate-android-icons.mjs
          npx cap sync android

      - name: Grant Execute Permission for Gradle Wrapper
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify Generated APK Exists and Check Size
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: APK file was not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload SmartMorning APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartmorning-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
